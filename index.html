:root{--navy:#0d1b3d;--teal:#12849a;--teal2:#e3f3f6;--sun:#f07a22;--sun2:#fff0e3;--bg:#f7fafc;--ink:#0d1b3d;--mut:#586585;--ln:#dfe7f0;--sf:#fff;--r:24px;font-family:Cairo,system-ui,sans-serif;color-scheme:light}
[data-theme=dark]{--bg:#070e20;--ink:#eef3fc;--mut:#9eb0d2;--ln:#22305a;--sf:#0f1a38;--teal:#3fc0d6;--teal2:#10304a;--sun2:#3a2514;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px;padding-bottom:env(safe-area-inset-bottom,0px);transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.w{width:min(1120px,calc(100% - 32px));margin-inline:auto}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px;text-align:center;position:relative}
header img{height:clamp(66px,15vw,96px);width:auto;max-width:74vw;border-radius:18px;background:#fff;padding:6px 14px;box-shadow:0 8px 26px rgba(13,27,61,.12)}
.lg{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));inset-inline-end:16px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:13px;z-index:3}
.th{inset-inline-end:auto;inset-inline-start:16px;font-size:17px;padding:4px 12px}
.hero{position:relative;border-radius:34px;overflow:hidden;min-height:clamp(520px,72vh,640px);display:flex;align-items:flex-end;margin-top:12px;background:#0d1b3d;isolation:isolate}
.hero>svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,14,32,.55) 0%,rgba(7,14,32,.05) 55%,rgba(7,14,32,.55) 100%)}
.hc{padding:clamp(22px,5vw,52px);color:#fff;max-width:640px;width:100%}
.tag{display:inline-block;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;font-weight:700;letter-spacing:.1em;font-size:12.5px;padding:5px 14px;border-radius:99px;margin-bottom:14px}
h1{font-size:clamp(2.2rem,6.4vw,4rem);line-height:1.12;margin:0 0 14px;font-weight:900;text-shadow:0 4px 24px rgba(0,0,0,.35)}
h1 em{font-style:normal;color:#ffb066}
.lead{color:#e8eefb;font-size:1.08rem;max-width:44ch;margin:0 0 22px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.b{border:0;border-radius:16px;padding:14px 28px;font-weight:700;cursor:pointer;font-size:15.5px;transition:.15s}
.b:active{transform:scale(.97)}.b1{background:var(--sun);color:#fff;box-shadow:0 10px 26px rgba(240,122,34,.4)}.b1:hover{background:#dc6a14}
.b2{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(6px)}
.wv{animation:wv 9s linear infinite}.wv2{animation:wv 14s linear infinite reverse}@keyframes wv{to{transform:translateX(-400px)}}
.shim{animation:sh 3s ease-in-out infinite alternate}@keyframes sh{to{transform:scaleX(.82)}}
.band{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 0}
.band div{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:18px 10px;text-align:center}.band b{display:block;font-size:1.7rem;color:var(--teal);line-height:1.2}.band span{font-size:13px;color:var(--mut)}
section{padding:54px 0 10px}
h2{font-size:clamp(1.7rem,4.2vw,2.5rem);margin:0 0 6px;font-weight:900;line-height:1.25}.sub{color:var(--mut);margin:0 0 26px}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}@media(max-width:820px){.dg{grid-template-columns:1fr}}
.dest{position:relative;border-radius:var(--r);overflow:hidden;min-height:300px;cursor:pointer;display:flex;align-items:flex-end;isolation:isolate;transition:transform .25s}
.dest:hover{transform:translateY(-4px)}
.dest svg{position:absolute;inset:0;width:100%;height:100%;z-index:-2}.dest:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 35%,rgba(7,14,32,.78))}
.dt{padding:20px;color:#fff;flex:1}.dt i{font-style:normal;color:#ffb066;font-weight:900;font-size:13px}.dt h3{margin:0;font-size:1.65rem}.dt p{margin:0;color:#dbe5f7;font-size:14px}
.arr{position:absolute;top:16px;inset-inline-end:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;font-size:19px}
.grp{background:linear-gradient(135deg,#0d1b3d,#12507a);color:#fff;border-radius:30px;padding:clamp(24px,5vw,44px);display:grid;grid-template-columns:1.4fr .6fr;gap:22px;align-items:center}
@media(max-width:700px){.grp{grid-template-columns:1fr}}
.grp h2{color:#fff}.grp p{color:#cfdaf0;margin:0 0 18px}.pct{font-size:clamp(3.4rem,10vw,5.4rem);font-weight:900;color:#ffb066;line-height:1;text-align:center}.pct small{display:block;font-size:14px;color:#cfdaf0;font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:30px;box-shadow:0 24px 60px rgba(13,27,61,.1);overflow:hidden}
.prog{height:6px;background:var(--ln)}.prog i{display:block;height:100%;width:20%;background:linear-gradient(90deg,var(--teal),var(--sun));transition:width .35s}
.step{display:none;padding:26px}.step.on{display:block;animation:up .35s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}.sh h3{margin:0;font-size:1.4rem}.sh span{color:var(--mut);font-size:13px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.o{border:2px solid var(--ln);border-radius:18px;padding:18px 14px;text-align:center;cursor:pointer;background:var(--sf);font-weight:700;transition:.15s}
.o small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;margin-top:4px}
.o:hover{border-color:var(--teal)}.o.on{border-color:var(--sun);background:var(--sun2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;max-height:200px;overflow:auto}
.chips .o{padding:8px 15px;border-radius:99px;font-size:13.5px;border-width:1.5px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}@media(max-width:560px){.f{grid-template-columns:1fr}}
.fl{display:flex;flex-direction:column;gap:5px}.fl.full{grid-column:1/-1}
label{font-size:13px;font-weight:700;color:var(--mut)}
input,select,textarea{border:1.5px solid var(--ln);border-radius:14px;padding:12px 14px;background:var(--sf);width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal2)}
.cnt{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--ln);border-radius:14px;padding:6px 8px}
.cnt button{width:38px;height:38px;border-radius:50%;border:0;background:var(--teal2);color:var(--teal);font-size:22px;cursor:pointer}.cnt b{font-size:1.15rem}
.ages{display:flex;gap:8px;flex-wrap:wrap}.ages select{width:auto}
.nt{background:var(--teal2);color:var(--ink);border-radius:14px;padding:11px 14px;font-size:13.5px;margin-top:12px;display:none}.nt.w2{background:var(--sun2)}
.sum{background:var(--teal2);border-radius:18px;padding:6px 18px}.sum div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--ln)}.sum div:last-child{border:0}.sum span{color:var(--mut)}.sum b{text-align:end}
.nav{display:flex;justify-content:space-between;gap:10px;padding:0 26px 26px}.nav .b2{background:var(--teal2);color:var(--teal);backdrop-filter:none}
.er{color:#e0523f;font-size:14px;min-height:22px;padding:0 26px}
footer{text-align:center;padding:40px 0 48px;color:var(--mut);font-size:14px}footer a{color:var(--teal);font-weight:700}
.wa{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#128c4f;color:#fff;border-radius:99px;padding:13px 20px;font-weight:700;box-shadow:0 10px 26px rgba(18,140,79,.4);z-index:20;transition:.3s}
.wa.hide{opacity:0;visibility:hidden;transform:translateY(14px)}
#in{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:18px;text-align:center;transition:transform .8s cubic-bezier(.7,0,.2,1)}
#in.go{transform:translateY(-102%)}#in img{width:min(980px,100%);height:auto;max-height:56vh;object-fit:contain;background:#fff;border-radius:26px;box-shadow:0 20px 60px rgba(13,27,61,.18)}
#in h2{margin:0;font-size:clamp(1.3rem,3.6vw,1.9rem)}#in p{margin:0;color:var(--mut);max-width:48ch}
</style>
</head>
